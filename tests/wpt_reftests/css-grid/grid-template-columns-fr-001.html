<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Grid Test: grid-template-columns fractional fr tracks</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://drafts.csswg.org/css-grid-1/#fr-unit">
    <link rel="match" href="grid-template-columns-fr-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            width: 300px;
            height: 100px;
            background: red;
        }
        .item1 {
            height: 100px;
            background: green;
        }
        .item2 {
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1"></div>
        <div class="item2"></div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Grid Test: grid-auto-flow column</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://drafts.csswg.org/css-grid-1/#grid-auto-flow-property">
    <link rel="match" href="grid-auto-flow-column-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .container {
            display: grid;
            grid-template-rows: 100px 100px;
            grid-template-columns: 100px 100px;
            grid-auto-flow: column;
            width: 200px;
            height: 200px;
            background: red;
        }
        .item {
            width: 100px;
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
</body>
</html>

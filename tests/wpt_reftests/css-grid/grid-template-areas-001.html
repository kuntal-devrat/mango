<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Grid Test: grid-template-areas</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://drafts.csswg.org/css-grid-1/#grid-template-areas-property">
    <link rel="match" href="grid-template-areas-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .container {
            display: grid;
            grid-template-areas: "a b" "c d";
            grid-template-columns: 100px 100px;
            grid-template-rows: 100px 100px;
            width: 200px;
            height: 200px;
            background: red;
        }
        .a { grid-area: a; width: 100px; height: 100px; background: green; }
        .b { grid-area: b; width: 100px; height: 100px; background: green; }
        .c { grid-area: c; width: 100px; height: 100px; background: green; }
        .d { grid-area: d; width: 100px; height: 100px; background: green; }
    </style>
</head>
<body>
    <div class="container">
        <div class="a"></div>
        <div class="b"></div>
        <div class="c"></div>
        <div class="d"></div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Grid Test: grid item center alignment</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://drafts.csswg.org/css-grid-1/#alignment">
    <link rel="match" href="grid-align-justify-center-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .container {
            display: grid;
            grid-template-columns: 300px;
            grid-template-rows: 300px;
            justify-items: center;
            align-items: center;
            width: 300px;
            height: 300px;
            background: blue;
        }
        .item {
            width: 100px;
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item"></div>
    </div>
</body>
</html>

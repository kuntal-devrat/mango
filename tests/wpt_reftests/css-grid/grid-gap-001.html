<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Grid Test: grid gap spacing</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://drafts.csswg.org/css-grid-1/#gutters">
    <link rel="match" href="grid-gap-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .container {
            display: grid;
            grid-template-columns: 100px 100px;
            gap: 20px;
            width: 220px;
            height: 100px;
            background: blue;
        }
        .item {
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item"></div>
        <div class="item"></div>
    </div>
</body>
</html>

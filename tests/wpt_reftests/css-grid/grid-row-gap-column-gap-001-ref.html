<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Grid Reference: row-gap and column-gap</title>
    <style>
        body { margin: 0; padding: 0; }
        .container {
            position: relative;
            width: 220px;
            height: 220px;
            background: blue;
        }
        .i1 { position: absolute; left: 0px; top: 0px; width: 100px; height: 100px; background: green; }
        .i2 { position: absolute; left: 120px; top: 0px; width: 100px; height: 100px; background: green; }
        .i3 { position: absolute; left: 0px; top: 120px; width: 100px; height: 100px; background: green; }
        .i4 { position: absolute; left: 120px; top: 120px; width: 100px; height: 100px; background: green; }
    </style>
</head>
<body>
    <div class="container">
        <div class="i1"></div>
        <div class="i2"></div>
        <div class="i3"></div>
        <div class="i4"></div>
    </div>
</body>
</html>

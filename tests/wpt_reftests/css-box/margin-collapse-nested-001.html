<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Box Model Test: nested parent and child margin collapse</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://www.w3.org/TR/CSS21/box.html#collapsing-margins">
    <link rel="match" href="margin-collapse-nested-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .parent {
            margin-top: 20px;
            width: 100px;
            background: red;
        }
        .child {
            margin-top: 40px;
            width: 100px;
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child"></div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Box Model Reference: percentage padding relative to container width</title>
    <style>
        body { margin: 0; padding: 0; }
        .container {
            width: 200px;
            height: 100px;
            background: blue;
        }
        .child {
            box-sizing: content-box;
            width: 100px;
            height: 60px;
            padding-top: 20px;
            padding-left: 20px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="child"></div>
    </div>
</body>
</html>

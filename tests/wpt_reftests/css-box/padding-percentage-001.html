<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Box Model Test: percentage padding relative to container width</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://www.w3.org/TR/CSS21/box.html#padding-properties">
    <link rel="match" href="padding-percentage-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .container {
            width: 200px;
            height: 100px;
            background: blue;
        }
        .child {
            box-sizing: content-box;
            width: 100px;
            height: 60px;
            padding-top: 10%;
            padding-left: 10%;
            background: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="child"></div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Box Model Test: block margin auto centering</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://www.w3.org/TR/CSS21/visudet.html#blockwidth">
    <link rel="match" href="margin-auto-centering-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .container {
            width: 300px;
            height: 100px;
            background: blue;
        }
        .child {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            background: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="child"></div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Positioning Test: absolute positioning relative to containing block</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://www.w3.org/TR/CSS21/visuren.html#absolute-positioning">
    <link rel="match" href="position-absolute-containing-block-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .container {
            position: relative;
            left: 50px;
            top: 50px;
            width: 100px;
            height: 100px;
            background: red;
        }
        .child {
            position: absolute;
            left: 0px;
            top: 0px;
            width: 100px;
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="child"></div>
    </div>
</body>
</html>

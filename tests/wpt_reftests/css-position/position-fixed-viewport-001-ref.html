<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Positioning Reference: fixed positioning ignores parent offsets</title>
    <style>
        body { margin: 0; padding: 0; }
        .parent {
            position: absolute;
            left: 200px;
            top: 150px;
            width: 300px;
            height: 200px;
            background: blue;
        }
        .reference {
            position: absolute;
            left: 20px;
            top: 30px;
            width: 100px;
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="parent"></div>
    <div class="reference"></div>
</body>
</html>

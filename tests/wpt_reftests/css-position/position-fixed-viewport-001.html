<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Positioning Test: fixed positioning ignores parent offsets</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://www.w3.org/TR/CSS21/visuren.html#fixed-positioning">
    <link rel="match" href="position-fixed-viewport-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .parent {
            margin-left: 200px;
            margin-top: 150px;
            width: 300px;
            height: 200px;
            background: blue;
        }
        .fixed-box {
            position: fixed;
            left: 20px;
            top: 30px;
            width: 100px;
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="fixed-box"></div>
    </div>
</body>
</html>

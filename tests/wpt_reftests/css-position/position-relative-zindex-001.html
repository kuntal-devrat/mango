<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Positioning Test: relative positioning z-index overlapping</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://www.w3.org/TR/CSS21/visuren.html#z-index">
    <link rel="match" href="position-relative-zindex-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .box1 {
            position: relative;
            z-index: 1;
            width: 100px;
            height: 100px;
            background: red;
        }
        .box2 {
            position: relative;
            z-index: 2;
            margin-top: -100px;
            width: 100px;
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
</body>
</html>

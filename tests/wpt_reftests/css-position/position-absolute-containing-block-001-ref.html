<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Positioning Reference: absolute positioning relative to containing block</title>
    <style>
        body { margin: 0; padding: 0; }
        .reference {
            position: absolute;
            left: 50px;
            top: 50px;
            width: 100px;
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="reference"></div>
</body>
</html>

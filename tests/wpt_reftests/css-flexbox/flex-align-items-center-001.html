<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Flexbox Test: align-items center</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://drafts.csswg.org/css-flexbox-1/#align-items-property">
    <link rel="match" href="flex-align-items-center-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .container {
            display: flex;
            align-items: center;
            width: 100px;
            height: 300px;
            background: blue;
        }
        .item {
            width: 100px;
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item"></div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Flexbox Reference: align-items center</title>
    <style>
        body { margin: 0; padding: 0; }
        .container {
            position: relative;
            width: 100px;
            height: 300px;
            background: blue;
        }
        .reference {
            position: absolute;
            left: 0px;
            top: 100px;
            width: 100px;
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="reference"></div>
    </div>
</body>
</html>

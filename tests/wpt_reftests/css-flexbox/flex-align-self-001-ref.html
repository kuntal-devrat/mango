<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Flexbox Reference: align-self overrides align-items</title>
    <style>
        body { margin: 0; padding: 0; }
        .container {
            position: relative;
            width: 200px;
            height: 200px;
            background: blue;
        }
        .item1 {
            position: absolute;
            left: 0px;
            top: 100px;
            width: 100px;
            height: 100px;
            background: green;
        }
        .item2 {
            position: absolute;
            left: 100px;
            top: 0px;
            width: 100px;
            height: 100px;
            background: yellow;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1"></div>
        <div class="item2"></div>
    </div>
</body>
</html>

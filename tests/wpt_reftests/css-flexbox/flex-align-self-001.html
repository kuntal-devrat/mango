<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Flexbox Test: align-self overrides align-items</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://drafts.csswg.org/css-flexbox-1/#align-items-property">
    <link rel="match" href="flex-align-self-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .container {
            display: flex;
            align-items: flex-start;
            width: 200px;
            height: 200px;
            background: blue;
        }
        .item1 {
            align-self: flex-end;
            width: 100px;
            height: 100px;
            background: green;
        }
        .item2 {
            width: 100px;
            height: 100px;
            background: yellow;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1"></div>
        <div class="item2"></div>
    </div>
</body>
</html>

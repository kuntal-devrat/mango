<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Flexbox Test: flex-grow expands items</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://drafts.csswg.org/css-flexbox-1/#flex-grow-property">
    <link rel="match" href="flex-grow-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .container {
            display: flex;
            width: 300px;
            height: 100px;
            background: red;
        }
        .item1 {
            flex-grow: 1;
            height: 100px;
            background: green;
        }
        .item2 {
            flex-grow: 2;
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1"></div>
        <div class="item2"></div>
    </div>
</body>
</html>

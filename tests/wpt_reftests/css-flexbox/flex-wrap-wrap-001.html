<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Flexbox Test: flex-wrap wrap</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://drafts.csswg.org/css-flexbox-1/#flex-wrap-property">
    <link rel="match" href="flex-wrap-wrap-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .container {
            display: flex;
            flex-wrap: wrap;
            width: 200px;
            height: 200px;
            background: red;
        }
        .item {
            width: 100px;
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
</body>
</html>

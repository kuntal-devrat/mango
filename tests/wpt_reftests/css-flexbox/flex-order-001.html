<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Flexbox Test: order property</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://drafts.csswg.org/css-flexbox-1/#order-property">
    <link rel="match" href="flex-order-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .container {
            display: flex;
            width: 200px;
            height: 100px;
        }
        .item1 {
            order: 2;
            width: 100px;
            height: 100px;
            background: green;
        }
        .item2 {
            order: 1;
            width: 100px;
            height: 100px;
            background: blue;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1"></div>
        <div class="item2"></div>
    </div>
</body>
</html>

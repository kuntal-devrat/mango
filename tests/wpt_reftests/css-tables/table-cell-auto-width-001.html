<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Tables Test: percentage width cells</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://www.w3.org/TR/CSS21/tables.html#auto-table-layout">
    <link rel="match" href="table-cell-auto-width-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        table {
            border-spacing: 0;
            padding: 0;
            margin: 0;
            border: none;
            width: 200px;
            height: 100px;
            background: red;
        }
        td {
            padding: 0;
            margin: 0;
            border: none;
        }
        td.left {
            width: 50%;
            height: 100px;
            background: green;
        }
        td.right {
            width: 50%;
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="left"></td>
            <td class="right"></td>
        </tr>
    </table>
</body>
</html>

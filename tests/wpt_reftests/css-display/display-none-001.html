<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Display Test: display none removes element from layout</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://www.w3.org/TR/CSS21/visuren.html#display-prop">
    <link rel="match" href="display-none-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .box1 {
            width: 100px;
            height: 100px;
            background: green;
        }
        .hidden-red {
            display: none;
            width: 100px;
            height: 100px;
            background: red;
        }
        .box2 {
            width: 100px;
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="hidden-red"></div>
    <div class="box2"></div>
</body>
</html>

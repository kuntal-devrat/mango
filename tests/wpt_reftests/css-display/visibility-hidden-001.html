<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Display Test: visibility hidden preserves layout space</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://www.w3.org/TR/CSS21/visufx.html#visibility">
    <link rel="match" href="visibility-hidden-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .container {
            width: 100px;
            height: 300px;
            background: blue;
        }
        .box1 {
            width: 100px;
            height: 100px;
            background: green;
        }
        .invisible-red {
            visibility: hidden;
            width: 100px;
            height: 100px;
            background: red;
        }
        .box2 {
            width: 100px;
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="invisible-red"></div>
        <div class="box2"></div>
    </div>
</body>
</html>

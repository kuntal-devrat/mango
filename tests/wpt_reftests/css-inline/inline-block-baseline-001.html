<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS Inline Test: inline-block formatting</title>
    <link rel="author" title="W3C">
    <link rel="help" href="https://www.w3.org/TR/CSS21/visudet.html#inline-block">
    <link rel="match" href="inline-block-baseline-001-ref.html">
    <style>
        body { margin: 0; padding: 0; }
        .container {
            font-size: 0;
            width: 200px;
            height: 100px;
            background: red;
        }
        .ib1 {
            display: inline-block;
            width: 100px;
            height: 100px;
            background: green;
        }
        .ib2 {
            display: inline-block;
            width: 100px;
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="container"><div class="ib1"></div><div class="ib2"></div></div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Layout Reference: Column and row gaps</title>
  <style>
    .container {
      position: relative;
      width: 220px;
      height: 110px;
      background: #ffffff;
    }
    .item {
      position: absolute;
      width: 100px;
      height: 50px;
      background: #008000;
    }
    .i1 { top: 0px; left: 0px; }
    .i2 { top: 0px; left: 120px; }
    .i3 { top: 60px; left: 0px; }
    .i4 { top: 60px; left: 120px; }
  </style>
</head>
<body style="margin: 0;">
  <div class="container">
    <div class="item i1"></div>
    <div class="item i2"></div>
    <div class="item i3"></div>
    <div class="item i4"></div>
  </div>
</body>
</html>

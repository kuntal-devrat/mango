<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Layout Reference: Basic two-column fixed layout</title>
  <style>
    .container {
      width: 300px;
      height: 100px;
    }
    .c1 {
      float: left;
      width: 100px;
      height: 100px;
      background: #0000ff;
    }
    .c2 {
      float: left;
      width: 200px;
      height: 100px;
      background: #00ff00;
    }
  </style>
</head>
<body style="margin: 0;">
  <div class="container">
    <div class="c1"></div>
    <div class="c2"></div>
  </div>
</body>
</html>

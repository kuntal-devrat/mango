<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Layout: Basic two-column fixed layout</title>
  <link rel="help" href="https://www.w3.org/TR/css-grid-1/#grid-template-columns">
  <link rel="match" href="grid-layout-basic-001-ref.html">
  <style>
    .grid {
      display: grid;
      grid-template-columns: 100px 200px;
      width: 300px;
      height: 100px;
    }
    .c1 {
      background: #0000ff;
    }
    .c2 {
      background: #00ff00;
    }
  </style>
</head>
<body style="margin: 0;">
  <div class="grid">
    <div class="c1"></div>
    <div class="c2"></div>
  </div>
</body>
</html>

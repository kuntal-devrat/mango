<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Level 2 Reference: Subgrid 2D bidirectional track alignment</title>
  <style>
    .container {
      position: relative;
      width: 250px;
      height: 150px;
    }
    .box { position: absolute; }
    .c00 { top: 0px; left: 0px; width: 100px; height: 60px; background: #ff0000; }
    .c01 { top: 0px; left: 100px; width: 150px; height: 60px; background: #00ff00; }
    .c10 { top: 60px; left: 0px; width: 100px; height: 90px; background: #0000ff; }
    .c11 { top: 60px; left: 100px; width: 150px; height: 90px; background: #ffff00; }
  </style>
</head>
<body style="margin: 0;">
  <div class="container">
    <div class="box c00"></div>
    <div class="box c01"></div>
    <div class="box c10"></div>
    <div class="box c11"></div>
  </div>
</body>
</html>

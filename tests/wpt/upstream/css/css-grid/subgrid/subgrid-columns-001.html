<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Level 2: Subgrid column track inheritance</title>
  <link rel="help" href="https://www.w3.org/TR/css-grid-2/#subgrids">
  <link rel="match" href="subgrid-columns-001-ref.html">
  <style>
    .parent {
      display: grid;
      grid-template-columns: 80px 120px 160px;
      width: 360px;
      height: 100px;
      background: #e0e0e0;
    }
    .subgrid {
      display: grid;
      grid-column: 2 / 4;
      grid-template-columns: subgrid;
      height: 100px;
    }
    .child1 {
      background: #ff5722;
    }
    .child2 {
      background: #2196f3;
    }
  </style>
</head>
<body style="margin: 0;">
  <div class="parent">
    <div style="background: #9e9e9e;"></div>
    <div class="subgrid">
      <div class="child1"></div>
      <div class="child2"></div>
    </div>
  </div>
</body>
</html>

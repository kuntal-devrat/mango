<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Level 2 Reference: Subgrid row track inheritance</title>
  <style>
    .container {
      position: relative;
      width: 200px;
      height: 160px;
    }
    .r1 {
      position: absolute;
      top: 0px;
      left: 0px;
      width: 200px;
      height: 60px;
      background: #e91e63;
    }
    .r2 {
      position: absolute;
      top: 60px;
      left: 0px;
      width: 200px;
      height: 100px;
      background: #4caf50;
    }
  </style>
</head>
<body style="margin: 0;">
  <div class="container">
    <div class="r1"></div>
    <div class="r2"></div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Level 2: Subgrid row track inheritance</title>
  <link rel="help" href="https://www.w3.org/TR/css-grid-2/#subgrids">
  <link rel="match" href="subgrid-rows-001-ref.html">
  <style>
    .parent {
      display: grid;
      grid-template-columns: 200px;
      grid-template-rows: 60px 100px;
      width: 200px;
      height: 160px;
    }
    .subgrid {
      display: grid;
      grid-row: 1 / 3;
      grid-template-rows: subgrid;
      width: 200px;
    }
    .r1 {
      background: #e91e63;
    }
    .r2 {
      background: #4caf50;
    }
  </style>
</head>
<body style="margin: 0;">
  <div class="parent">
    <div class="subgrid">
      <div class="r1"></div>
      <div class="r2"></div>
    </div>
  </div>
</body>
</html>

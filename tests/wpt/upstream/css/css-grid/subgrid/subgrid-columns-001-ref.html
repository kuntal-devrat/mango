<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Level 2 Reference: Subgrid column track inheritance</title>
  <style>
    .container {
      position: relative;
      width: 360px;
      height: 100px;
      background: #e0e0e0;
    }
    .b1 {
      position: absolute;
      top: 0px;
      left: 0px;
      width: 80px;
      height: 100px;
      background: #9e9e9e;
    }
    .b2 {
      position: absolute;
      top: 0px;
      left: 80px;
      width: 120px;
      height: 100px;
      background: #ff5722;
    }
    .b3 {
      position: absolute;
      top: 0px;
      left: 200px;
      width: 160px;
      height: 100px;
      background: #2196f3;
    }
  </style>
</head>
<body style="margin: 0;">
  <div class="container">
    <div class="b1"></div>
    <div class="b2"></div>
    <div class="b3"></div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Level 2: Subgrid 2D bidirectional track alignment</title>
  <link rel="help" href="https://www.w3.org/TR/css-grid-2/#subgrids">
  <link rel="match" href="subgrid-bidirectional-001-ref.html">
  <style>
    .parent {
      display: grid;
      grid-template-columns: 100px 150px;
      grid-template-rows: 60px 90px;
      width: 250px;
      height: 150px;
    }
    .subgrid {
      display: grid;
      grid-column: 1 / 3;
      grid-row: 1 / 3;
      grid-template-columns: subgrid;
      grid-template-rows: subgrid;
    }
    .c00 { background: #ff0000; }
    .c01 { background: #00ff00; }
    .c10 { background: #0000ff; }
    .c11 { background: #ffff00; }
  </style>
</head>
<body style="margin: 0;">
  <div class="parent">
    <div class="subgrid">
      <div class="c00"></div>
      <div class="c01"></div>
      <div class="c10"></div>
      <div class="c11"></div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Layout: Column and row gaps</title>
  <link rel="help" href="https://www.w3.org/TR/css-grid-1/#gutters">
  <link rel="match" href="grid-gap-001-ref.html">
  <style>
    .grid {
      display: grid;
      grid-template-columns: 100px 100px;
      grid-template-rows: 50px 50px;
      column-gap: 20px;
      row-gap: 10px;
      width: 220px;
      height: 110px;
      background: #ffffff;
    }
    .item {
      background: #008000;
    }
  </style>
</head>
<body style="margin: 0;">
  <div class="grid">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
  </div>
</body>
</html>

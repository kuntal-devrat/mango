<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Layout: Flexible fr unit distribution</title>
  <link rel="help" href="https://www.w3.org/TR/css-grid-1/#fr-unit">
  <link rel="match" href="grid-fr-units-001-ref.html">
  <style>
    .grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      width: 300px;
      height: 100px;
    }
    .c1 {
      background: #ff0000;
    }
    .c2 {
      background: #0000ff;
    }
  </style>
</head>
<body style="margin: 0;">
  <div class="grid">
    <div class="c1"></div>
    <div class="c2"></div>
  </div>
</body>
</html>

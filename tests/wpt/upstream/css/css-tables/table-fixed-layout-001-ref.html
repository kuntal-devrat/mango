<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Tables Reference: Fixed table layout with explicit column widths</title>
  <style>
    .container {
      width: 400px;
      height: 60px;
    }
    .c1 {
      float: left;
      width: 150px;
      height: 60px;
      background: #0000ff;
    }
    .c2 {
      float: left;
      width: 250px;
      height: 60px;
      background: #00ff00;
    }
  </style>
</head>
<body style="margin: 0;">
  <div class="container">
    <div class="c1"></div>
    <div class="c2"></div>
  </div>
</body>
</html>

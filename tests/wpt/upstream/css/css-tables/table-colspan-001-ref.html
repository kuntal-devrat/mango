<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Tables Reference: Colspan spanning two columns</title>
  <style>
    .top {
      width: 200px;
      height: 40px;
      background: #ff00ff;
    }
    .row {
      width: 200px;
      height: 40px;
    }
    .c1 {
      float: left;
      width: 100px;
      height: 40px;
      background: #0000ff;
    }
    .c2 {
      float: left;
      width: 100px;
      height: 40px;
      background: #00ff00;
    }
  </style>
</head>
<body style="margin: 0;">
  <div class="top"></div>
  <div class="row">
    <div class="c1"></div>
    <div class="c2"></div>
  </div>
</body>
</html>

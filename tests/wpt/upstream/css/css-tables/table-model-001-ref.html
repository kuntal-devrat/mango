<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Tables Reference: Basic cell sizing and rows</title>
  <style>
    .row {
      width: 200px;
      height: 50px;
    }
    .cell {
      float: left;
      width: 100px;
      height: 50px;
    }
    .c1 { background: #0000ff; }
    .c2 { background: #00ff00; }
    .c3 { background: #ff0000; }
    .c4 { background: #ffff00; }
  </style>
</head>
<body style="margin: 0;">
  <div class="row">
    <div class="cell c1"></div>
    <div class="cell c2"></div>
  </div>
  <div class="row">
    <div class="cell c3"></div>
    <div class="cell c4"></div>
  </div>
</body>
</html>

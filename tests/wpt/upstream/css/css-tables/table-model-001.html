<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Tables: Basic cell sizing and rows</title>
  <link rel="help" href="https://www.w3.org/TR/CSS22/tables.html#table-display">
  <link rel="match" href="table-model-001-ref.html">
  <style>
    table {
      border-spacing: 0;
      border-collapse: separate;
      margin: 0;
      padding: 0;
    }
    td {
      padding: 0;
      margin: 0;
      width: 100px;
      height: 50px;
    }
    .c1 { background: #0000ff; }
    .c2 { background: #00ff00; }
    .c3 { background: #ff0000; }
    .c4 { background: #ffff00; }
  </style>
</head>
<body style="margin: 0;">
  <table>
    <tr>
      <td class="c1"></td>
      <td class="c2"></td>
    </tr>
    <tr>
      <td class="c3"></td>
      <td class="c4"></td>
    </tr>
  </table>
</body>
</html>

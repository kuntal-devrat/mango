<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Tables: Fixed table layout with explicit column widths</title>
  <link rel="help" href="https://www.w3.org/TR/CSS22/tables.html#fixed-table-layout">
  <link rel="match" href="table-fixed-layout-001-ref.html">
  <style>
    table {
      table-layout: fixed;
      width: 400px;
      border-spacing: 0;
      margin: 0;
      padding: 0;
    }
    col.col1 { width: 150px; }
    col.col2 { width: 250px; }
    td {
      padding: 0;
      height: 60px;
    }
    .c1 { background: #0000ff; }
    .c2 { background: #00ff00; }
  </style>
</head>
<body style="margin: 0;">
  <table>
    <colgroup>
      <col class="col1">
      <col class="col2">
    </colgroup>
    <tr>
      <td class="c1"></td>
      <td class="c2"></td>
    </tr>
  </table>
</body>
</html>

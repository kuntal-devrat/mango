<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Inline Reference: Vertical alignment top</title>
  <style>
    .container {
      width: 200px;
      height: 100px;
    }
    .tall {
      float: left;
      width: 100px;
      height: 100px;
      background: #0000ff;
    }
    .short {
      float: left;
      width: 100px;
      height: 50px;
      background: #00ff00;
    }
  </style>
</head>
<body style="margin: 0;">
  <div class="container">
    <div class="tall"></div>
    <div class="short"></div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Inline Reference: Basic inline-block boxes</title>
  <style>
    .container {
      width: 300px;
      height: 80px;
    }
    .box {
      float: left;
      width: 100px;
      height: 80px;
    }
    .b1 { background: #0000ff; }
    .b2 { background: #00ff00; }
    .b3 { background: #ff0000; }
  </style>
</head>
<body style="margin: 0;">
  <div class="container">
    <div class="box b1"></div>
    <div class="box b2"></div>
    <div class="box b3"></div>
  </div>
</body>
</html>

name: CI

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  change-detection:
    name: Detect Changed Subsystems
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      rust: ${{ steps.filter.outputs.rust }}
      modularity: ${{ steps.filter.outputs.modularity }}
      platform: ${{ steps.filter.outputs.platform }}
      wpt: ${{ steps.filter.outputs.wpt }}
      headless: ${{ steps.filter.outputs.headless }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'crates/**'
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            rust:
              - 'crates/**/*.rs'
              - 'src/**/*.rs'
              - 'tests/**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            modularity:
              - 'crates/**/*.rs'
              - 'crates/**/*.js'
              - 'src/**/*.rs'
              - 'src/**/*.js'
              - '.github/workflows/ci.yml'
            platform:
              - 'crates/mango_platform/**'
              - 'crates/mango_ipc/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            wpt:
              - 'tests/wpt/**'
              - 'tests/wpt_*.rs'
              - 'crates/mango_layout/**'
              - 'crates/mango_css/**'
              - 'crates/mango_js/**'
              - 'crates/mango_html/**'
              - 'crates/mango_core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            headless:
              - 'src/bin/headless.rs'
              - 'crates/mango_render/**'
              - 'crates/mango_layout/**'
              - 'crates/mango_engine/**'
              - 'crates/mango_platform/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  modularity-audit:
    name: Source File Modularity (<= 1000 lines)
    needs: [change-detection]
    if: needs.change-detection.outputs.modularity == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify All Source Files Obey <= 1000 Lines Rule
        run: |
          python3 -c "
          import os, sys
          violations = []
          for root, _, files in os.walk('.'):
              if any(p in root for p in ['target', '.git', 'node_modules', '.freebuff', 'tests']):
                  continue
              for f in files:
                  if f.endswith('.rs') or f.endswith('.js'):
                      path = os.path.join(root, f)
                      with open(path, 'r', encoding='utf-8', errors='ignore') as fp:
                          lines = sum(1 for _ in fp)
                          if lines > 1000:
                              violations.append((lines, path))
          if violations:
              print('Error: The following source files exceed the 1000-line modularity limit:')
              for lines, path in violations:
                  print(f'  {lines} lines: {path}')
              sys.exit(1)
          print('All source files obey <= 1000 lines.')
          "

  fmt:
    name: Code Formatting
    needs: [change-detection]
    if: needs.change-detection.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Linter
    needs: [change-detection]
    if: needs.change-detection.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    name: Workspace Tests (Linux)
    needs: [change-detection]
    if: needs.change-detection.outputs.code == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libasound2-dev libfontconfig1-dev
      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

  test-cross-platform:
    name: Workspace Tests (${{ matrix.os }})
    needs: [change-detection]
    # Runs on trunk push, manual dispatch, or PRs touching platform-specific code / labeled 'ci:cross-platform'
    if: |
      (needs.change-detection.outputs.code == 'true') && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.change-detection.outputs.platform == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'ci:cross-platform')
      )
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

  wpt-official:
    name: Official WPT Test Suites
    runs-on: ubuntu-latest
    needs: [change-detection, test-linux]
    if: needs.change-detection.outputs.wpt == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libasound2-dev libfontconfig1-dev
      - name: Run Official Web Platform Tests
        run: cargo test --test wpt_official_runner --verbose
      - name: Verify Modular WPT Expectations
        run: cargo run --bin wpt-runner -- --check-expectations css/css-text-decor css/css-cascade

  headless-smoke-test:
    name: Headless Renderer Smoke Test
    runs-on: ubuntu-latest
    needs: [change-detection, test-linux]
    if: needs.change-detection.outputs.headless == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev
      - name: Build Headless Renderer
        run: cargo build --bin headless --release
      - name: Test HTML Viewport Rendering
        run: |
          ./target/release/headless "data:text/html,<html><body style='background:%23ff9900;'><h1 style='color:%23ffffff;'>Mango</h1></body></html>" output.png 800 600 --page
          test -f output.png
      - name: Test Element Selector Probe
        run: |
          ./target/release/headless "data:text/html,<html><body><button id='btn'>Submit</button></body></html>" --probe "#btn" 800 600

  ci-status:
    name: CI Status Gate
    runs-on: ubuntu-latest
    needs:
      - change-detection
      - modularity-audit
      - fmt
      - clippy
      - test-linux
      - test-cross-platform
      - wpt-official
      - headless-smoke-test
    if: always()
    steps:
      - name: Evaluate All Job Results
        run: |
          python3 -c "
          import json, sys
          results = {
            'change-detection': '${{ needs.change-detection.result }}',
            'modularity-audit': '${{ needs.modularity-audit.result }}',
            'fmt': '${{ needs.fmt.result }}',
            'clippy': '${{ needs.clippy.result }}',
            'test-linux': '${{ needs.test-linux.result }}',
            'test-cross-platform': '${{ needs.test-cross-platform.result }}',
            'wpt-official': '${{ needs.wpt-official.result }}',
            'headless-smoke-test': '${{ needs.headless-smoke-test.result }}',
          }
          failed = [job for job, outcome in results.items() if outcome in ('failure', 'cancelled')]
          if failed:
              print(f'❌ CI Failed! The following jobs failed or were cancelled: {failed}')
              sys.exit(1)
          print('✅ All CI jobs succeeded or were safely skipped according to change detection.')
          "

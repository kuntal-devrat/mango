name: CI

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  modularity-audit:
    name: Source File Modularity (<= 800 lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify All Source Files Obey <= 800 Lines Rule
        run: |
          python3 -c "
          import os, sys
          violations = []
          for root, _, files in os.walk('.'):
              if any(p in root for p in ['target', '.git', 'node_modules', '.freebuff', 'tests']):
                  continue
              for f in files:
                  if f.endswith('.rs') or f.endswith('.js'):
                      path = os.path.join(root, f)
                      with open(path, 'r', encoding='utf-8', errors='ignore') as fp:
                          lines = sum(1 for _ in fp)
                          if lines > 800:
                              violations.append((lines, path))
          if violations:
              print('Error: The following source files exceed the 800-line modularity limit:')
              for lines, path in violations:
                  print(f'  {lines} lines: {path}')
              sys.exit(1)
          print('All source files obey <= 800 lines.')
          "

  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Workspace Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libasound2-dev libfontconfig1-dev
      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

  wpt-official:
    name: Official WPT Test Suites
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libasound2-dev libfontconfig1-dev
      - name: Run Official Web Platform Tests
        run: cargo test --test wpt_official_runner --verbose
      - name: Verify Modular WPT Expectations
        run: cargo run --bin wpt-runner -- --check-expectations css/css-text-decor css/css-cascade

  headless-smoke-test:
    name: Headless Renderer Smoke Test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev
      - name: Build Headless Renderer
        run: cargo build --bin headless --release
      - name: Test HTML Viewport Rendering
        run: |
          ./target/release/headless "data:text/html,<html><body style='background:%23ff9900;'><h1 style='color:%23ffffff;'>Mango</h1></body></html>" output.png 800 600 --page
          test -f output.png
      - name: Test Element Selector Probe
        run: |
          ./target/release/headless "data:text/html,<html><body><button id='btn'>Submit</button></body></html>" --probe "#btn" 800 600

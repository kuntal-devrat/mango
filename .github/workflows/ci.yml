name: CI

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  change-detection:
    name: Detect Changed Subsystems
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.filter.outputs.all }}
      rust: ${{ steps.filter.outputs.rust }}
      modularity: ${{ steps.filter.outputs.modularity }}
      core: ${{ steps.filter.outputs.core }}
      html: ${{ steps.filter.outputs.html }}
      css: ${{ steps.filter.outputs.css }}
      layout: ${{ steps.filter.outputs.layout }}
      render: ${{ steps.filter.outputs.render }}
      net: ${{ steps.filter.outputs.net }}
      ipc: ${{ steps.filter.outputs.ipc }}
      platform: ${{ steps.filter.outputs.platform }}
      js: ${{ steps.filter.outputs.js }}
      engine: ${{ steps.filter.outputs.engine }}
      browser: ${{ steps.filter.outputs.browser }}
      wpt: ${{ steps.filter.outputs.wpt }}
      headless: ${{ steps.filter.outputs.headless }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            all:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            rust:
              - 'crates/**/*.rs'
              - 'src/**/*.rs'
              - 'tests/**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            modularity:
              - 'crates/**/*.rs'
              - 'crates/**/*.js'
              - 'src/**/*.rs'
              - 'src/**/*.js'
              - '.github/workflows/ci.yml'
            core:
              - 'crates/mango_core/**'
            html:
              - 'crates/mango_html/**'
              - 'crates/mango_core/**'
            css:
              - 'crates/mango_css/**'
              - 'crates/mango_core/**'
            layout:
              - 'crates/mango_layout/**'
              - 'crates/mango_css/**'
              - 'crates/mango_html/**'
              - 'crates/mango_core/**'
            render:
              - 'crates/mango_render/**'
              - 'crates/mango_core/**'
            net:
              - 'crates/mango_net/**'
            ipc:
              - 'crates/mango_ipc/**'
            platform:
              - 'crates/mango_platform/**'
              - 'crates/mango_ipc/**'
            js:
              - 'crates/mango_js/**'
            engine:
              - 'crates/mango_engine/**'
              - 'crates/mango_core/**'
            browser:
              - 'src/**'
              - 'tests/**'
            wpt:
              - 'tests/wpt/**'
              - 'tests/wpt_*.rs'
              - 'crates/mango_layout/**'
              - 'crates/mango_css/**'
              - 'crates/mango_js/**'
              - 'crates/mango_html/**'
              - 'crates/mango_core/**'
            headless:
              - 'src/bin/headless.rs'
              - 'crates/mango_render/**'
              - 'crates/mango_layout/**'
              - 'crates/mango_engine/**'
              - 'crates/mango_platform/**'

  modularity-audit:
    name: Source File Modularity (<= 1000 lines)
    needs: [change-detection]
    if: needs.change-detection.outputs.modularity == 'true' || needs.change-detection.outputs.all == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify All Source Files are <= 1000 lines
        run: |
          python3 -c "
          import os, sys
          failed = False
          roots = ['crates', 'src', 'tests']
          for r in roots:
              for root, _, files in os.walk(r):
                  for f in files:
                      if f.endswith('.rs') or f.endswith('.js'):
                          p = os.path.join(root, f)
                          with open(p, 'r', encoding='utf-8', errors='ignore') as fh:
                              cnt = sum(1 for _ in fh)
                          if cnt > 1000:
                              print(f'VIOLATION: {p} has {cnt} lines (> 1000)')
                              failed = True
          if failed:
              sys.exit(1)
          print('All source files conform strictly to <= 1000 lines rule.')
          "

  fmt:
    name: Code Formatting
    needs: [change-detection]
    if: needs.change-detection.outputs.rust == 'true' || needs.change-detection.outputs.all == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Formatting
        run: cargo fmt --check --all

  clippy:
    name: Clippy Linter
    needs: [change-detection]
    if: needs.change-detection.outputs.rust == 'true' || needs.change-detection.outputs.all == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libasound2-dev libfontconfig1-dev
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-mango-core:
    name: Test mango_core
    needs: [change-detection]
    if: needs.change-detection.outputs.core == 'true' || needs.change-detection.outputs.all == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Run mango_core Tests
        run: cargo test -p mango_core --verbose

  test-mango-html:
    name: Test mango_html
    needs: [change-detection]
    if: needs.change-detection.outputs.html == 'true' || needs.change-detection.outputs.all == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Run mango_html Tests
        run: cargo test -p mango_html --verbose

  test-mango-css:
    name: Test mango_css
    needs: [change-detection]
    if: needs.change-detection.outputs.css == 'true' || needs.change-detection.outputs.all == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Run mango_css Tests
        run: cargo test -p mango_css --verbose

  test-mango-layout:
    name: Test mango_layout
    needs: [change-detection]
    if: needs.change-detection.outputs.layout == 'true' || needs.change-detection.outputs.all == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Run mango_layout Tests
        run: cargo test -p mango_layout --verbose

  test-mango-render:
    name: Test mango_render
    needs: [change-detection]
    if: needs.change-detection.outputs.render == 'true' || needs.change-detection.outputs.all == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Run mango_render Tests
        run: cargo test -p mango_render --verbose

  test-mango-net:
    name: Test mango_net
    needs: [change-detection]
    if: needs.change-detection.outputs.net == 'true' || needs.change-detection.outputs.all == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Run mango_net Tests
        run: cargo test -p mango_net --verbose

  test-mango-ipc:
    name: Test mango_ipc
    needs: [change-detection]
    if: needs.change-detection.outputs.ipc == 'true' || needs.change-detection.outputs.all == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Run mango_ipc Tests
        run: cargo test -p mango_ipc --verbose

  test-mango-platform:
    name: Test mango_platform
    needs: [change-detection]
    if: needs.change-detection.outputs.platform == 'true' || needs.change-detection.outputs.all == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libasound2-dev libfontconfig1-dev
      - name: Run mango_platform Tests
        run: cargo test -p mango_platform --verbose

  test-mango-js:
    name: Test mango_js
    needs: [change-detection]
    if: needs.change-detection.outputs.js == 'true' || needs.change-detection.outputs.all == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Run mango_js Tests
        run: cargo test -p mango_js --verbose

  test-mango-engine:
    name: Test mango_engine
    needs: [change-detection]
    if: needs.change-detection.outputs.engine == 'true' || needs.change-detection.outputs.all == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Run mango_engine Tests
        run: cargo test -p mango_engine --verbose

  test-integration:
    name: Browser Integration Tests
    needs: [change-detection]
    if: needs.change-detection.outputs.browser == 'true' || needs.change-detection.outputs.all == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libasound2-dev libfontconfig1-dev
      - name: Run Integration Tests
        run: cargo test -p mango-browser --tests --verbose -- --skip wpt

  test-platform-cross:
    name: Platform Tests (${{ matrix.os }})
    needs: [change-detection]
    if: |
      (needs.change-detection.outputs.all == 'true' || needs.change-detection.outputs.platform == 'true') && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ci:cross-platform') ||
        needs.change-detection.outputs.platform == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Run Platform Tests
        run: cargo test -p mango_platform -p mango_ipc --verbose

  wpt-official:
    name: Official WPT Test Suites
    runs-on: ubuntu-latest
    needs: [change-detection]
    if: needs.change-detection.outputs.wpt == 'true' || needs.change-detection.outputs.all == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libasound2-dev libfontconfig1-dev
      - name: Run Official Web Platform Tests
        run: cargo test --test wpt_official_runner --verbose
      - name: Verify Modular WPT Expectations
        run: cargo run --bin wpt-runner -- --check-expectations css/css-text-decor css/css-cascade

  headless-smoke-test:
    name: Headless Renderer Smoke Test
    runs-on: ubuntu-latest
    needs: [change-detection]
    if: needs.change-detection.outputs.headless == 'true' || needs.change-detection.outputs.all == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev
      - name: Build Headless Renderer
        run: cargo build --bin headless --release
      - name: Test HTML Viewport Rendering
        run: |
          ./target/release/headless "data:text/html,<html><body style='background:%23ff9900;'><h1 style='color:%23ffffff;'>Mango</h1></body></html>" output.png 800 600 --page
          test -f output.png
      - name: Test Element Selector Probe
        run: |
          ./target/release/headless "data:text/html,<html><body><button id='btn'>Submit</button></body></html>" --probe "#btn" 800 600

  ci-status:
    name: CI Status Gate
    runs-on: ubuntu-latest
    needs:
      - change-detection
      - modularity-audit
      - fmt
      - clippy
      - test-mango-core
      - test-mango-html
      - test-mango-css
      - test-mango-layout
      - test-mango-render
      - test-mango-net
      - test-mango-ipc
      - test-mango-platform
      - test-mango-js
      - test-mango-engine
      - test-integration
      - test-platform-cross
      - wpt-official
      - headless-smoke-test
    if: always()
    steps:
      - name: Evaluate All Job Results
        run: |
          python3 -c "
          import json, sys
          results = {
            'change-detection': '${{ needs.change-detection.result }}',
            'modularity-audit': '${{ needs.modularity-audit.result }}',
            'fmt': '${{ needs.fmt.result }}',
            'clippy': '${{ needs.clippy.result }}',
            'test-mango-core': '${{ needs.test-mango-core.result }}',
            'test-mango-html': '${{ needs.test-mango-html.result }}',
            'test-mango-css': '${{ needs.test-mango-css.result }}',
            'test-mango-layout': '${{ needs.test-mango-layout.result }}',
            'test-mango-render': '${{ needs.test-mango-render.result }}',
            'test-mango-net': '${{ needs.test-mango-net.result }}',
            'test-mango-ipc': '${{ needs.test-mango-ipc.result }}',
            'test-mango-platform': '${{ needs.test-mango-platform.result }}',
            'test-mango-js': '${{ needs.test-mango-js.result }}',
            'test-mango-engine': '${{ needs.test-mango-engine.result }}',
            'test-integration': '${{ needs.test-integration.result }}',
            'test-platform-cross': '${{ needs.test-platform-cross.result }}',
            'wpt-official': '${{ needs.wpt-official.result }}',
            'headless-smoke-test': '${{ needs.headless-smoke-test.result }}',
          }
          failed = [job for job, outcome in results.items() if outcome in ('failure', 'cancelled')]
          if failed:
              print(f'❌ CI Failed! The following jobs failed or were cancelled: {failed}')
              sys.exit(1)
          print('✅ All CI jobs succeeded or were safely skipped according to change detection.')
          "

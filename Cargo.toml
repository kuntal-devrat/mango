[workspace]
resolver = "2"
members = [
    "crates/mango_core",
    "crates/mango_net",
    "crates/mango_html",
    "crates/mango_css",
    "crates/mango_layout",
    "crates/mango_render",
    "crates/mango_js",
    "crates/mango_platform",
    "crates/mango_events",
    "crates/mango_engine",
    "crates/mango_ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mango Contributors"]
license = "MIT"
description = "An ultra-lightweight web browser built from scratch in pure Rust"

[workspace.dependencies]
# Shared across crates
mango_core = { path = "crates/mango_core" }
mango_net = { path = "crates/mango_net" }
mango_html = { path = "crates/mango_html" }
mango_css = { path = "crates/mango_css" }
mango_layout = { path = "crates/mango_layout" }
mango_render = { path = "crates/mango_render" }
mango_js = { path = "crates/mango_js" }
mango_platform = { path = "crates/mango_platform" }
mango_events = { path = "crates/mango_events" }
mango_engine = { path = "crates/mango_engine" }
mango_ipc = { path = "crates/mango_ipc" }

# External dependencies (pinned versions)
winit = "0.30"
softbuffer = "0.4"
tiny-skia = "0.11"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip", "brotli"] }
arboard = "3.4"
wuff = "0.2.9"
lgpu = "0.1.2"
naga = { version = "30", default-features = false, features = ["wgsl-in", "spv-out"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.10"
deno_core = "0.412.0"
getrandom = "0.2"


[package]
name = "mango-browser"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
default-run = "mango"

[lib]
name = "mango_browser"
path = "src/lib.rs"

[[bin]]
name = "mango"
path = "src/main.rs"

[[bin]]
name = "headless"
path = "src/bin/headless.rs"

[[bin]]
name = "wpt-runner"
path = "src/bin/wpt_runner.rs"

[[bin]]
name = "wpt-reftest-runner"
path = "src/bin/wpt_reftest_runner.rs"

[dependencies]
mango_core.workspace = true
mango_html.workspace = true
mango_css.workspace = true
mango_layout.workspace = true
mango_render.workspace = true
mango_platform.workspace = true
mango_net.workspace = true
mango_js.workspace = true
mango_events.workspace = true
mango_engine.workspace = true
mango_ipc.workspace = true
image.workspace = true
log.workspace = true
env_logger.workspace = true
winit.workspace = true
arboard.workspace = true
fontdue.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[profile.release]
opt-level = 2
lto = false          # Completely disabled: LTO with rusty_v8/deno_core exhausts RAM and freezes laptop
codegen-units = 16   # Low-memory codegen units
strip = true         # Strip symbols
panic = "unwind"     # Safe panic recovery without process abort

[profile.dev]
debug = 1           # Line tables only: fast linking and reduces RAM usage by >60%

[profile.test]
debug = 1           # Prevents memory spikes during parallel test binary linking
